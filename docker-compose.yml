services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: eswar@259522
      MYSQL_DATABASE: Gym
    ports:
      - "3306:3306"
    volumes:
      - ./gym.sql:/docker-entrypoint-initdb.d/gym.sql
      - db_data:/var/lib/mysql

  web:
    build: .
    restart: on-failure
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: eswar@259522
      MYSQL_DB: Gym
    ports:
      - "5000:5000"

volumes:
  db_data:
